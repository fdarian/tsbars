[package]
name = "tsbars-mapper"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "TypeScript content mapper server for tsbars (JSON-RPC over stdio)"

[[bin]]
name = "tsbars-mapper"
path = "src/main.rs"

[dependencies]
tsbars = { path = "../tsbars" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
